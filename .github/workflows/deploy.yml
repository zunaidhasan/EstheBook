name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    outputs:
      base-url: ${{ steps.get-repo-info.outputs.base-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get repository info
        id: get-repo-info
        run: |
          REPO_NAME=$(basename ${{ github.repository }})
          BASE_URL="/${REPO_NAME}/"
          echo "base-url=${BASE_URL}" >> $GITHUB_OUTPUT
          echo "Repository: ${{ github.repository }}, Base URL: ${BASE_URL}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href ${{ steps.get-repo-info.outputs.base-url }}

      - name: Add 404 fallback
        run: cp build/web/index.html build/web/404.html

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
